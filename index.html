 <div class="card p-3"><p class="text-[13px] font-bold text-forest mb-1">Códigos de verificación</p><p class="text-[11px] text-fade mb-2">Para crear una cuenta de proveedor nueva. Cada código se usa una sola vez.</p>${cs.map(c => `<button class="btn l w-full mb-1.5" style="font-size:12px" onclick="demoCode('${c}')">${c}</button>`).join('') || '<p class="text-[11.5px] text-fade">Todos usados. Reinicia los datos para recuperarlos.</p>'}</div>`)
      }
      function demoFill(e) { closeM(); setAuth('in'); $('ae').value = e; $('ap').value = 'uis123' }
      function demoCode(c) { closeM(); setAuth('up', 'sup'); $('ac').value = c }
      function askCode() { openM(`<h3 class="serif text-[18px] text-forest mb-1">Solicitar código de verificación</h3><p class="text-[12px] text-fade mb-3">Solo se entrega a distribuidoras y mayoristas. Surtiya revisa tu empresa antes de enviarlo.</p><input id="rn" class="in mb-2" placeholder="Nombre de la empresa"><input id="rt" inputmode="numeric" class="in mb-2" placeholder="NIT"><input id="rp" type="tel" class="in mb-2" placeholder="WhatsApp de contacto"><p id="re" class="text-rust text-[12px]"></p><button class="btn g w-full mt-2" onclick="sendCode()">Enviar solicitud</button>`) }
      function sendCode() { const n = $('rn').value.replace(/[<>&"'`]/g, '').trim(), t = $('rt').value.replace(/\D/g, ''), ph = $('rp').value.replace(/\D/g, ''); if (!n || t.length < 9 || ph.length < 7) { $('re').textContent = 'Completa empresa, NIT (9 o 10 dígitos) y teléfono.'; return } S.codeReq.push({ n, t, ph, ts: Date.now() }); save(); closeM(); toast('Solicitud enviada: Surtiya validará tu empresa') }
      function logout() { save(); S.role = null; S.user = null; authTab = 'in'; R() }
      function askExit() { openM(`<h3 class="serif text-[18px] text-forest mb-1">¿Cerrar sesión?</h3><p class="text-[13px] text-fade mb-4">Saldrás de tu cuenta. Tus datos quedan guardados.</p><div class="flex gap-2"><button class="btn l flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" style="background:#C0503F" onclick="closeM();logout()">Salir</button></div>`) }
      function askReset() { openM(`<h3 class="serif text-[18px] text-forest mb-1">¿Reiniciar los datos?</h3><p class="text-[13px] text-fade mb-4">Se borrarán tus cambios y la app volverá al estado inicial de prueba.</p><div class="flex gap-2"><button class="btn l flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" style="background:#C0503F" onclick="resetDemo()">Reiniciar</button></div>`) }
      function resetDemo() { try { localStorage.removeItem(K) } catch (e) { } location.reload() }

      /* ==========================================================
         8. RENDER Y ARRANQUE
         ========================================================== */
      function R() {
         expire();
         const m = $('m'), n = $('nav');
         if (!S.role) { $('hd').style.display = 'none'; $('who').textContent = ''; n.innerHTML = ''; m.innerHTML = authView(); return }
         $('hd').style.display = ''; $('lg').innerHTML = logo(28); $('hr').innerHTML = ic('refresh', 20); $('hx').innerHTML = ic('logout', 20); $('who').textContent = U().n;
         const tabs = S.role === 'shop' ? TS : TP; if (!tabs.some(t => t[0] === tab) && tab !== 'chat') tab = tabs[0][0];
         renderNav();
         m.innerHTML = V[tab](); renderNav(); m.scrollTop = tab === 'chat' && cv ? m.scrollHeight : 0; save()
      }
      function renderNav() { $('hs').innerHTML = ic('clock', 20) + (TOFF ? `<span class="nbadge" style="background:#C98A3E">+${TOFF}</span>` : ''); $('hc').innerHTML = ic('chat', 20) + (nb('chat') ? `<span class="nbadge">${nb('chat')}</span>` : ''); $('nav').innerHTML = (S.role === 'shop' ? TS : TP).map(t => `<button onclick="go('${t[0]}')" class="flex-1 pt-2 text-[10px] font-semibold ${tab === t[0] ? 'text-forest' : 'text-fade'}"><div class="flex justify-center relative">${ic(t[2], 22)}${nb(t[0]) ? `<span class="nbadge">${nb(t[0])}</span>` : ''}</div>${t[1]}</button>`).join('') }
      function tick() { $('clk').textContent = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', hour12: false }) }
      tick(); setInterval(tick, 30000);
      R();
   </script>
