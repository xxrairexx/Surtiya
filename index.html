         },
         sh() {
            const os = S.orders.filter(o => o.sid === MY), done = os.filter(o => o.st === 3), v = done.reduce((a, o) => a + tot(o) - o.ship, 0);
            return `<h2 class="serif text-[21px] text-forest">${sp(MY)}</h2><p class="text-[12px] text-fade mb-3">Nuevos clientes y más pedidos, desde un solo lugar. Zona: ${zoneOf(MY)}${SUP[MY].tel ? ' · Contacto: ' + SUP[MY].tel : ''}</p>
 <div class="grid grid-cols-2 gap-2 mb-3">
 <div class="card p-3"><p class="text-[20px] font-bold text-rust">${os.filter(o => o.st === 0).length}</p><p class="text-[10.5px] text-fade">Pedidos por confirmar</p></div>
 <div class="card p-3"><p class="text-[20px] font-bold text-forest">${SUP[MY].ot ? SUP[MY].ot + '%' : '—'}</p><p class="text-[10.5px] text-fade">Entregas a tiempo</p></div>
 <div class="card p-3"><p class="text-[16px] font-bold text-forest">${money(v)}</p><p class="text-[10.5px] text-fade">Vendido (completados)</p></div>
 <div class="card p-3"><p class="text-[16px] font-bold text-em">${money(v * .97)}</p><p class="text-[10.5px] text-fade">Neto tras comisión 3 %</p></div></div>`
         },
         so() {
            const os = [...S.orders].filter(o => o.sid === MY).reverse(), L = ['Aceptar pedido', 'Despachar', 'Marcar entregado'];
            return `<h2 class="serif text-[20px] text-forest mb-3">Pedidos recibidos</h2>${os.map(o => `<div class="card p-3 mb-2"><div class="flex justify-between text-[12.5px]"><b>#${o.id} · ${o.sn}</b><b>${money(tot(o))}</b></div>
 <p class="text-[11px] text-fade">${o.items.map(i => i.q + ' × ' + nm(i.p)).join(', ')}</p>${stepper(o.st)}
 ${o.st < 3 ? `<div class="flex gap-2 mt-2"><button class="btn g flex-1" onclick="adv(${o.id})">${L[o.st]}</button>${o.st === 0 ? `<button class="btn l" onclick="adv(${o.id},1)">Rechazar</button>` : ''}</div>` : ''}</div>`).join('') || '<p class="text-[12px] text-fade">Aún no tienes pedidos.</p>'}`
         },
         sc() {
            return `<div class="flex items-center justify-between mb-1"><h2 class="serif text-[20px] text-forest">Mi catálogo</h2><button class="btn g" onclick="newOffer()">+ Producto</button></div><p class="text-[11.5px] text-fade mb-3">Los comerciantes ven estos precios y existencias al instante.</p>
 ${S.offers.map((o, i) => o.s !== MY ? '' : `<div class="card p-3 mb-2"><p class="text-[13px] font-semibold mb-2">${nm(o.p)}</p><div class="grid grid-cols-1 gap-2 text-[10px] text-fade">
 <label>Precio<input class="in mt-1" type="number" value="${o.pr}" onchange="setO(${i},'pr',this.value)"></label>
 <label>Existencias<input class="in mt-1" type="number" value="${o.st}" onchange="setO(${i},'st',this.value)"></label>
 <label>Mínimo<input class="in mt-1" type="number" value="${o.mn}" onchange="setO(${i},'mn',this.value)"></label></div></div>`).join('')}${S.offers.some(o => o.s === MY) ? '' : '<p class="text-[12px] text-fade card p-4 text-center">Aún no tienes productos. Agrega el primero con «+ Producto».</p>'}`
         }
      };

      /* ==========================================================
         7. ACCIONES (carrito, pedidos, cancelar, inventario, sesión, ubicación)
         ========================================================== */
      function addCart(p, s, q, nw) {
         const o = S.offers.find(x => x.p === p && x.s === s); q = Math.max(q, o.mn);
         const c = S.cart.find(x => x.p === p && x.s === s); c ? c.q += q : S.cart.push({ p, s, q, n: nw && !S.inv.some(i => i.p === p && i.s <= i.m) ? 1 : 0 }); toast(`Agregado: ${q} × ${nm(p)}`); save(); tab === 'find' ? renderNav() : R()
      }
      function qty(i, d) { const c = S.cart[i], o = S.offers.find(x => x.p === c.p && x.s === c.s); c.q = Math.max(0, c.q + d * Math.min(o.mn, 6)); if (!c.q) S.cart.splice(i, 1); R() }
      function send(s, keep) {
         const items = S.cart.filter(c => c.s === s).map(c => { const lp = S.offers.find(o => o.p === c.p && o.s === s).pr; return { p: c.p, q: c.q, pr: up(lp, c.q), lp } });
         const o = { id: Date.now() % 100000 + S.orders.length, shop: S.user, sn: U().n, sid: s, items, ship: shipTo(s), st: 0, d: 'Hoy', ts: Date.now(), eta: etaTo(s), bz: myZ() };
         S.orders.push(o); S.cart = S.cart.filter(c => c.s !== s); if (keep) return o; notify([o])
      }
      function sendAll() { notify([...new Set(S.cart.map(c => c.s))].map(s => send(s, 1))) }
      function reorderAll() { needL().forEach(i => { const b = best(i.p); if (b) addCart(i.p, b.s, Math.max(b.mn, i.m * 2 - i.s)) }); ot = 'cart'; tab = 'ord'; R() }
      function repeatO(id) { const o = S.orders.find(x => x.id === id); o.items.forEach(i => addCart(i.p, o.sid, i.q)); toast('Pedido agregado al carrito'); ot = 'cart'; tab = 'ord'; R() }
      function askCancel(id) { const o = S.orders.find(x => x.id === id), c = cancelInfo(o); if (!c.ok) return toast(c.msg); openM(`<h3 class="serif text-[18px] text-forest mb-1">¿Cancelar el pedido #${id}?</h3><p class="text-[13px] text-fade mb-4">${c.msg} Cuando el proveedor lo tome, deberás completarlo.</p><div class="flex gap-2"><button class="btn l flex-1" onclick="closeM()">Volver</button><button class="btn flex-1" style="background:#C0503F" onclick="cancelO(${id})">Sí, cancelar</button></div>`) }
      function cancelO(id) { const o = S.orders.find(x => x.id === id), c = cancelInfo(o); if (!c.ok) return toast(c.msg); o.st = 4; o.cx = 1; closeM(); toast('Pedido cancelado'); R() }
      function adv(id, rej) {
         const o = S.orders.find(x => x.id === id);
         if (rej) { o.st = 4 } else { o.st++; if (o.st === 3) o.items.forEach(i => { const I = S.data[o.shop].inv, v = I.find(x => x.p === i.p); v ? v.s += i.q : I.push({ p: i.p, s: i.q, m: 6, v: 0 }) }) }
         toast(o.st === 3 ? 'Entregado: el inventario de la tienda se actualizó' : 'Estado: ' + ST[o.st]); R()
      }
      function move(p) {
         const v = S.inv.find(x => x.p === p);
         openM(`<h3 class="serif text-[18px] text-forest mb-1">${nm(p)}</h3><p class="text-[12px] text-fade mb-3">Existencias: ${v.s} · mínimo: ${v.m}</p>
 <select id="mt" class="in mb-2"><option value="out">Venta / salida</option><option value="in">Entrada</option><option value="loss">Pérdida o daño</option></select>
 <input id="mq" type="number" min="1" placeholder="Cantidad" class="in mb-2">
 <label class="text-[11px] text-fade">Alerta de nivel mínimo</label><input id="mm" type="number" min="0" value="${v.m}" class="in mt-1">
 <button class="btn g w-full mt-4" onclick="saveMove(${p})">Guardar</button><button class="btn l w-full mt-2 flex items-center justify-center gap-2" onclick="delItem(${p})">${ic('trash', 18)} Quitar del inventario</button>`)
      }
      function saveMove(p) {
         const v = S.inv.find(x => x.p === p), t = $('mt').value, n = +$('mq').value || 0; v.m = +$('mm').value || 0;
         if (t === 'in') v.s += n; else { v.s = Math.max(0, v.s - n); if (t === 'out') v.v += n } closeM(); toast('Inventario actualizado'); R()
      }
      function delItem(p) { S.inv = S.inv.filter(x => x.p !== p); closeM(); toast('Producto quitado'); R() }
      function setO(i, k, val) { S.offers[i][k] = Math.max(0, +val || 0); save(); toast('Catálogo actualizado') }
      function visit() { S.visit = true; toast('Solicitud enviada: un asesor te visitará'); R() }
      function contact(s) { const x = SUP[s]; openM(`<h3 class="serif text-[18px] text-forest mb-1">${x.n}</h3><p class="text-[13px] text-fade mb-3">${x.ot ? stars(x.r) + ' ' + x.r + ' · ' + x.ot + '% a tiempo' : 'Proveedor nuevo'} · Entrega: ${etaTo(s)}</p><p class="text-[14px] mb-3">Contacto: <b>${x.tel}</b></p><a class="btn g w-full block text-center" href="https://wa.me/57${x.tel}" target="_blank" rel="noopener">Escribir por WhatsApp</a><a class="btn l w-full block text-center mt-2" href="tel:${x.tel}">Llamar</a>`) }
      function pick(j) { sel = FK[j]; R() }
      function setZ(v) { U().z = v; save(); toast('Ubicación actualizada'); R() }
      function locate() { if (!navigator.geolocation) return toast('Tu dispositivo no permite ubicación'); navigator.geolocation.getCurrentPosition(p => { const c = p.coords; setZ(ZN.map(z => [z[0], (z[1] - c.latitude) ** 2 + (z[2] - c.longitude) ** 2]).sort((a, b) => a[1] - b[1])[0][0]) }, () => toast('No se pudo obtener tu ubicación')) }
      function setAuth(t, r) { authTab = t; if (r) authRole = r; R() }
      function startSession(u) { S.user = u.e; S.role = u.r; if (u.r === 'sup') MY = u.s; else { const d = S.data[u.e] || { inv: [], cart: [], visit: false }; S.inv = d.inv; S.cart = d.cart; S.visit = d.visit } tab = u.r === 'shop' ? 'home' : 'sh'; R() }
      function login() { const e = $('ae').value.trim().toLowerCase(), u = S.users.find(x => x.e === e && x.p === $('ap').value); if (!u) return err('Correo o contraseña incorrectos.'); startSession(u) }
      function register() {
         const n = $('an').value.replace(/[<>&"'`]/g, '').trim(), e = $('ae').value.trim().toLowerCase(), p = $('ap').value;
         if (!n || !e.includes('@') || p.length < 4) return err('Completa el nombre, un correo válido y una contraseña de mínimo 4 caracteres.');
         if (S.users.some(x => x.e === e)) return err('Ese correo ya está registrado.');
         const u = { e, p, r: authRole, n, z: $('az').value };
         if (authRole === 'sup') { const s = Math.max(...Object.keys(SUP).map(Number)) + 1; SUP[s] = S.sups[s] = { n, r: 0, ot: 0, z: $('az').value, tel: $('atl').value.replace(/\D/g, '') || '3000000000' }; u.s = s }
         S.users.push(u); if (u.r === 'shop') S.data[e] = { inv: [], cart: [], visit: false }; toast('¡Cuenta creada!'); startSession(u)
      }
      function logout() { save(); S.role = null; S.user = null; authTab = 'in'; R() }
      function askExit() { openM(`<h3 class="serif text-[18px] text-forest mb-1">¿Cerrar sesión?</h3><p class="text-[13px] text-fade mb-4">Saldrás de tu cuenta. Tus datos quedan guardados.</p><div class="flex gap-2"><button class="btn l flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" style="background:#C0503F" onclick="closeM();logout()">Salir</button></div>`) }
      function askReset() { openM(`<h3 class="serif text-[18px] text-forest mb-1">¿Reiniciar los datos?</h3><p class="text-[13px] text-fade mb-4">Se borrarán tus cambios y la app volverá al estado inicial de prueba.</p><div class="flex gap-2"><button class="btn l flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" style="background:#C0503F" onclick="resetDemo()">Reiniciar</button></div>`) }
      function resetDemo() { try { localStorage.removeItem(K) } catch (e) { } location.reload() }

      /* ==========================================================
         8. RENDER Y ARRANQUE
         ========================================================== */
      function R() {
         const m = $('m'), n = $('nav');
         if (!S.role) { $('hd').style.display = 'none'; $('who').textContent = ''; n.innerHTML = ''; m.innerHTML = authView(); return }
         $('hd').style.display = ''; $('lg').innerHTML = logo(28); $('hr').innerHTML = ic('refresh', 20); $('hx').innerHTML = ic('logout', 20); $('who').textContent = U().n;
         const tabs = S.role === 'shop' ? TS : TP; if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
         renderNav();
         m.innerHTML = V[tab](); m.scrollTop = 0; save()
      }
      function renderNav() { $('nav').innerHTML = (S.role === 'shop' ? TS : TP).map(t => `<button onclick="go('${t[0]}')" class="flex-1 pt-2 text-[10px] font-semibold ${tab === t[0] ? 'text-forest' : 'text-fade'}"><div class="flex justify-center relative">${ic(t[2], 22)}${nb(t[0]) ? `<span class="nbadge">${nb(t[0])}</span>` : ''}</div>${t[1]}</button>`).join('') }
      function tick() { $('clk').textContent = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', hour12: false }) }
      tick(); setInterval(tick, 30000);
      R();
   </script>

</body>

</html>
